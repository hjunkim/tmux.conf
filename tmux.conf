##### tmux.conf - practical defaults for engineering workflows #####

# Use Ctrl-a as prefix (common for power users)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Better terminal behavior
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 200000
set -g mouse on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g set-clipboard on

# Vi-like controls
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Faster pane navigation (vim-style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane resizing with Shift + hjkl
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes in current directory
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

# Quick window and session helpers
bind c new-window -c '#{pane_current_path}'
bind-key -n M-Left previous-window
bind-key -n M-Right next-window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[fg=green]#S #[fg=colour240]| #[default]"
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M #[default]"

##### Plugins (managed by TPM) #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

# Plugin configuration
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @catppuccin_flavor 'mocha'

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
